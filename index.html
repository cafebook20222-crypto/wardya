<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق وردية - النسخة المتقدمة | Wardya Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      forest: { DEFAULT:'#0a2e23', dark:'#061c15', light:'#0d3b2e', surface:'#124839' },
      gold: { DEFAULT:'#d4af37', light:'#e6ca65', dark:'#aa8c2c' }
    },
    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
  }}
}
</script>
<style>
body { font-family:'Cairo', sans-serif; background: radial-gradient(circle at center, #0d3b2e 0%, #061c15 100%); min-height:100vh; }
.hide-scrollbar::-webkit-scrollbar { display:none; }
.hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
/* الحل الجذري لمشكلة hidden vs flex */
.force-hidden { display: none !important; }
@keyframes pulse-ring { 0% { transform:scale(0.95); box-shadow:0 0 0 0 rgba(212,175,55,0.7);} 70% { transform:scale(1); box-shadow:0 0 0 15px rgba(212,175,55,0);} 100% { transform:scale(0.95); box-shadow:0 0 0 0 rgba(212,175,55,0);} }
.pulse-ring { animation: pulse-ring 2s infinite; }
@keyframes slide-up { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.slide-up { animation: slide-up 0.3s ease-out; }
@keyframes slide-in { from { transform:translateX(100%); } to { transform:translateX(0); } }
.slide-in { animation: slide-in 0.3s ease-out; }
</style>
</head>
<body class="flex flex-col items-center justify-center p-2 sm:p-6 text-slate-100 min-h-screen">

<div class="mb-4 text-center space-y-1">
  <h1 class="text-xl sm:text-2xl font-black text-gold tracking-wide flex items-center justify-center gap-2">
    <i class="fa-solid fa-kaaba text-gold"></i> منصة وَردِيّة | Wardya
  </h1>
  <p class="text-xs text-emerald-200">النسخة المتقدمة — التوظيف الموسمي بالساعة</p>
</div>

<!-- PHONE FRAME -->
<div class="relative w-full max-w-[420px] h-[850px] bg-black rounded-[50px] p-3 shadow-2xl border-[6px] border-slate-700/80 ring-1 ring-gold/30 flex flex-col justify-between overflow-hidden">
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-[80] flex items-center justify-between px-4">
    <div class="w-3 h-3 bg-emerald-900 rounded-full flex items-center justify-center">
      <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></div>
    </div>
    <div class="w-10 h-1 bg-slate-800 rounded-full"></div>
  </div>

  <div class="relative w-full h-full bg-forest-dark rounded-[40px] overflow-hidden border border-forest-light">

    <!-- MAIN APP -->
    <div id="mainApp" class="force-hidden flex flex-col h-full pt-6">
      <div class="bg-forest-light/95 backdrop-blur-md px-3 py-2.5 border-b border-gold/20 flex items-center justify-between z-40">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-gold-light to-gold flex items-center justify-center text-forest-dark font-black text-lg shadow-md border border-gold-light">و</div>
          <div>
            <h2 class="font-extrabold text-[11px] text-white leading-tight">وَردِيّة <span class="text-gold font-normal">| Wardya</span></h2>
            <p class="text-[8px] text-emerald-300/80 flex items-center gap-1">
              <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> مكة المكرمة
            </p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="openNotifications()" class="relative w-8 h-8 rounded-full bg-forest-surface flex items-center justify-center border border-gold/30">
            <i class="fa-solid fa-bell text-gold text-xs"></i>
            <span id="notifBadge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-500 text-white text-[8px] font-bold flex items-center justify-center border border-forest-dark">0</span>
          </button>
          <button onclick="openChat()" class="relative w-8 h-8 rounded-full bg-forest-surface flex items-center justify-center border border-gold/30">
            <i class="fa-solid fa-comment-dots text-gold text-xs"></i>
            <span id="chatBadge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 text-white text-[8px] font-bold flex items-center justify-center border border-forest-dark">0</span>
          </button>
        </div>
      </div>

      <div class="bg-forest-dark px-3 py-1 border-b border-white/5 flex items-center justify-between text-[10px]">
        <div class="flex items-center gap-1 text-emerald-300">
          <i class="fa-solid fa-mosque text-gold text-[10px]"></i>
          <span class="font-bold" id="nextPrayerText">—</span>
        </div>
        <div class="flex items-center gap-1 text-[9px]" id="connectionBox">
          <i class="fa-solid fa-wifi text-emerald-400"></i>
          <span id="connectionStatus" class="text-emerald-400">متصل</span>
        </div>
      </div>

      <div class="bg-forest p-1.5 border-b border-forest-light flex text-[10px] font-bold gap-1">
        <button id="btnRoleSeeker" onclick="setRole('seeker')" class="flex-1 py-1.5 rounded-lg transition-all flex items-center justify-center gap-1">
          <i class="fa-solid fa-user-graduate"></i> باحث عن وردية
        </button>
        <button id="btnRoleProvider" onclick="setRole('provider')" class="flex-1 py-1.5 rounded-lg transition-all flex items-center justify-center gap-1">
          <i class="fa-solid fa-building-user"></i> منشأة
        </button>
      </div>

      <div id="screenContainer" class="flex-1 overflow-y-auto hide-scrollbar p-3 space-y-3 text-slate-100"></div>

      <div class="bg-forest-dark/95 backdrop-blur-md border-t border-gold/20 py-2 px-1 flex justify-around items-center text-[9px] text-emerald-200/70 z-40">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-chart-pie text-base"></i><span>الرئيسية</span>
        </button>
        <button onclick="switchTab('map')" id="nav-map" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-map-location-dot text-base"></i><span>الخريطة</span>
        </button>
        <button onclick="switchTab('create')" id="nav-create" class="flex flex-col items-center gap-0.5 transition-all px-1 relative">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gold to-gold-light text-forest-dark flex items-center justify-center -mt-4 shadow-lg border border-white/20">
            <i class="fa-solid fa-plus text-sm font-black"></i>
          </div>
          <span class="text-[8px]">طلب</span>
        </button>
        <button onclick="switchTab('shifts')" id="nav-shifts" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-file-signature text-base"></i><span>وردياتي</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-id-card-clip text-base"></i><span>الملف</span>
        </button>
      </div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="force-hidden absolute inset-0 z-[65] bg-forest-dark flex flex-col">
      <div class="flex-1 flex flex-col items-center justify-center p-6 space-y-6 pt-12 overflow-y-auto hide-scrollbar">
        <div class="text-center space-y-2">
          <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-gold-light to-gold flex items-center justify-center text-forest-dark font-black text-4xl shadow-2xl border-4 border-gold-light/30">و</div>
          <h1 class="text-2xl font-black text-gold">وَردِيّة</h1>
          <p class="text-xs text-emerald-200">منصة التوظيف الموسمي بالساعة</p>
        </div>
        <div id="authStep1" class="w-full space-y-3">
          <label class="block text-xs font-bold text-emerald-200">رقم الجوال</label>
          <div class="flex items-center gap-2 bg-forest-surface border border-gold/30 rounded-xl p-3">
            <span class="text-slate-300 text-sm font-bold" dir="ltr">+966</span>
            <input id="phoneInput" type="tel" placeholder="5XXXXXXXX" maxlength="9" class="flex-1 bg-transparent outline-none text-white font-bold text-sm text-center" dir="ltr">
          </div>
          <button onclick="sendOTP()" class="w-full bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black py-3 rounded-xl shadow-lg text-sm">
            <i class="fa-solid fa-paper-plane ml-1"></i> إرسال رمز التحقق
          </button>
          <p class="text-[10px] text-center text-slate-400 leading-relaxed">بالدخول أنت توافق على <span class="text-gold">الشروط والأحكام</span></p>
          <div class="flex items-center gap-2 justify-center pt-2 text-[10px] text-slate-400">
            <i class="fa-solid fa-shield-halved text-gold"></i>
            <span>محمي عبر نفاذ / أبشر</span>
          </div>
        </div>
        <div id="authStep2" class="force-hidden w-full space-y-3">
          <label class="block text-xs font-bold text-emerald-200 text-center">أدخل رمز التحقق</label>
          <p class="text-center text-[10px] text-slate-400">تم الإرسال إلى <span class="text-gold font-bold" id="sentToPhone">—</span></p>
          <div class="flex justify-center gap-2" id="otpInputs"></div>
          <p class="text-center text-[10px] text-slate-400">لم تستلم الرمز؟ <button onclick="sendOTP()" class="text-gold font-bold">إعادة الإرسال</button></p>
          <button onclick="verifyOTP()" class="w-full bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black py-3 rounded-xl shadow-lg text-sm">
            <i class="fa-solid fa-shield-halved ml-1"></i> تحقق ودخول
          </button>
          <button onclick="backToPhone()" class="w-full text-xs text-emerald-300 py-2">← تغيير رقم الجوال</button>
        </div>
      </div>
    </div>

    <!-- ACTIVE SHIFT OVERLAY -->
    <div id="activeShiftOverlay" class="force-hidden absolute inset-0 z-[55] bg-forest-dark flex flex-col"></div>

    <!-- NOTIFICATIONS DRAWER -->
    <div id="notificationsDrawer" class="force-hidden absolute top-0 right-0 h-full w-[88%] bg-forest-dark z-[56] flex flex-col"></div>

    <!-- CHAT SCREENS -->
    <div id="chatScreen" class="force-hidden absolute inset-0 z-[57] bg-forest-dark flex flex-col"></div>
    <div id="chatView" class="force-hidden absolute inset-0 z-[58] bg-forest-dark flex flex-col"></div>

    <!-- WALLET -->
    <div id="walletScreen" class="force-hidden absolute inset-0 z-[57] bg-forest-dark flex flex-col"></div>

    <!-- SETTINGS -->
    <div id="settingsScreen" class="force-hidden absolute inset-0 z-[57] bg-forest-dark flex flex-col"></div>

    <!-- MODAL -->
    <div id="modalContainer" class="force-hidden absolute inset-0 z-[60] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"></div>

  </div>
</div>

<script>
/* ============ STATE ============ */
const state = {
  isAuthenticated: false,
  userRole: 'seeker',
  activeTab: 'dashboard',
  shiftsSubTab: 'upcoming',
  isOffline: false,
  user: { name:'عبد الله محمد العتيبي', rating:4.9, totalShifts:28, totalHours:164 },
  provider: { name:'شركة إكرام الحرمين للضيافة' },
  wallet: {
    balance: 7380,
    transactions: [
      { type:'credit', amount:360, description:'أرباح وردية - برج الساعة', date:'27 أكتوبر 2026' },
      { type:'credit', amount:480, description:'أرباح وردية - مخيمات منى', date:'26 أكتوبر 2026' },
      { type:'debit', amount:1000, description:'سحب بنكي', date:'25 أكتوبر 2026' }
    ]
  },
  notifications: [
    { id:1, title:'وردية جديدة قريبة منك', body:'فندق برج الساعة - 45 ر.س/ساعة', time:'قبل 5 دقائق', read:false, icon:'fa-bolt', color:'text-amber-400' },
    { id:2, title:'تم قبول طلبك', body:'مشرف تفويج بمخيمات منى', time:'قبل ساعة', read:false, icon:'fa-check-circle', color:'text-emerald-400' },
    { id:3, title:'تذكير بالحضور', body:'ورديتك القادمة بعد ساعتين', time:'قبل 3 ساعات', read:true, icon:'fa-clock', color:'text-blue-400' }
  ],
  chats: [
    { id:1, name:'فندق برج الساعة', avatar:'ف', lastMessage:'متى تستطيع البدء؟', time:'10:30 ص', unread:2, messages:[
      { from:'them', text:'السلام عليكم، تم قبول طلبك', time:'10:25 ص' },
      { from:'me', text:'شكراً جزيلاً', time:'10:28 ص' },
      { from:'them', text:'متى تستطيع البدء؟', time:'10:30 ص' }
    ]},
    { id:2, name:'شركة مخيمات منى', avatar:'م', lastMessage:'تم إرسال العقد', time:'09:15 ص', unread:0, messages:[
      { from:'them', text:'تم إرسال العقد الرقمي لك', time:'09:15 ص' }
    ]}
  ],
  activeShift: null,
  shifts: {
    upcoming: [
      { id:'WRD-001', title:'مشرف تفويج بمخيمات منى', place:'المشاعر - منى', date:'غداً 04:00 م', rate:60, hours:8 }
    ],
    past: [
      { id:'P1', title:'استقبال - برج الساعة', place:'مكة', date:'27 أكتوبر 2026', rate:45, hours:8, earned:360, rating:5 }
    ]
  },
  reviews: [
    { id:1, name:'فندق برج الساعة', rating:5, text:'موظف ملتزم ومحترف.', date:'27 أكتوبر 2026' }
  ],
  prayerTimes: [
    { name:'الفجر', time:'04:32' }, { name:'الظهر', time:'12:18' },
    { name:'العصر', time:'15:35' }, { name:'المغرب', time:'18:50' }, { name:'العشاء', time:'20:20' }
  ]
};

let activeShiftTimer = null;
let selectedRating = 0;

/* ============ HELPERS ============ */
function showEl(id) { document.getElementById(id).classList.remove('force-hidden'); }
function hideEl(id) { document.getElementById(id).classList.add('force-hidden'); }
function saveState() {
  try { localStorage.setItem('wardya', JSON.stringify({
    isAuthenticated: state.isAuthenticated,
    userRole: state.userRole
  })); } catch(e){}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('wardya') || '{}');
    if (s.isAuthenticated) state.isAuthenticated = true;
    if (s.userRole) state.userRole = s.userRole;
  } catch(e){}
}

/* ============ AUTH ============ */
function buildOtpInputs() {
  const cont = document.getElementById('otpInputs');
  cont.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const inp = document.createElement('input');
    inp.maxLength = 1; inp.inputMode = 'numeric'; inp.type = 'tel';
    inp.className = 'w-10 h-12 bg-forest-surface border border-gold/30 rounded-xl text-center text-lg font-black text-gold outline-none focus:border-gold';
    inp.addEventListener('input', (e) => moveOtp(e.target, i));
    inp.addEventListener('keydown', (e) => handleOtpKey(e, i));
    cont.appendChild(inp);
  }
}
function moveOtp(el, idx) {
  el.value = el.value.replace(/\D/g, '');
  if (el.value && idx < 5) document.querySelectorAll('#otpInputs input')[idx + 1].focus();
  const all = document.querySelectorAll('#otpInputs input');
  if ([...all].every(i => i.value)) setTimeout(verifyOTP, 300);
}
function handleOtpKey(e, idx) {
  if (e.key === 'Backspace' && !e.target.value && idx > 0) {
    document.querySelectorAll('#otpInputs input')[idx - 1].focus();
  }
}
function sendOTP() {
  const phone = document.getElementById('phoneInput').value.trim();
  if (phone.length < 9) { alert('أدخل رقم جوال صحيح (9 أرقام)'); return; }
  document.getElementById('sentToPhone').innerText = '+966 ' + phone;
  document.getElementById('authStep1').classList.add('force-hidden');
  document.getElementById('authStep2').classList.remove('force-hidden');
  setTimeout(() => document.querySelectorAll('#otpInputs input')[0].focus(), 100);
}
function backToPhone() {
  document.getElementById('authStep1').classList.remove('force-hidden');
  document.getElementById('authStep2').classList.add('force-hidden');
  document.querySelectorAll('#otpInputs input').forEach(i => i.value = '');
}
function verifyOTP() {
  state.isAuthenticated = true;
  saveState();
  hideEl('authScreen');
  showEl('mainApp');
  updateRoleButtons();
  updateNavBar();
  renderAppScreen();
  updateBadges();
  updatePrayerBar();
}
function logout() {
  if (!confirm('هل تريد تسجيل الخروج؟')) return;
  state.isAuthenticated = false;
  state.activeShift = null;
  if (activeShiftTimer) clearInterval(activeShiftTimer);
  saveState();
  hideEl('settingsScreen');
  hideEl('mainApp');
  showEl('authScreen');
  backToPhone();
}

/* ============ NAV ============ */
function setRole(role) {
  state.userRole = role;
  saveState();
  updateRoleButtons();
  renderAppScreen();
}
function updateRoleButtons() {
  const s = document.getElementById('btnRoleSeeker');
  const p = document.getElementById('btnRoleProvider');
  const active = 'flex-1 py-1.5 rounded-lg bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black shadow transition-all flex items-center justify-center gap-1';
  const inactive = 'flex-1 py-1.5 rounded-lg text-emerald-200 hover:text-white transition-all flex items-center justify-center gap-1';
  if (state.userRole === 'seeker') { s.className = active; p.className = inactive; }
  else { p.className = active; s.className = inactive; }
}
function switchTab(tab) {
  state.activeTab = tab;
  updateNavBar();
  renderAppScreen();
}
function updateNavBar() {
  const tabs = ['dashboard','map','create','shifts','profile'];
  tabs.forEach(t => {
    const el = document.getElementById('nav-' + t);
    if (!el) return;
    if (t === state.activeTab) {
      el.className = "flex flex-col items-center gap-0.5 transition-all px-1 text-gold font-bold";
    } else {
      el.className = "flex flex-col items-center gap-0.5 transition-all px-1 text-emerald-200/70 hover:text-gold";
    }
  });
}

/* ============ RENDER DISPATCHER ============ */
function renderAppScreen() {
  if (state.activeTab === 'dashboard') renderDashboard();
  else if (state.activeTab === 'map') renderMap();
  else if (state.activeTab === 'create') renderCreate();
  else if (state.activeTab === 'shifts') renderShifts();
  else if (state.activeTab === 'profile') renderProfile();
}

/* ============ DASHBOARD ============ */
function renderDashboard() {
  const c = document.getElementById('screenContainer');
  if (state.userRole === 'seeker') {
    c.innerHTML = `
      ${state.activeShift ? `
      <div class="bg-gradient-to-r from-emerald-600 to-emerald-500 p-3 rounded-2xl border border-emerald-400 space-y-2">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
          <span class="text-[10px] font-black text-white">وردية نشطة الآن</span>
        </div>
        <h3 class="font-bold text-white text-xs">${state.activeShift.title}</h3>
        <button onclick="showActiveShiftOverlay()" class="w-full bg-white text-emerald-700 font-black py-1.5 rounded-xl text-xs">
          <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i> استعراض
        </button>
      </div>` : ''}

      <div class="grid grid-cols-3 gap-2">
        <div class="bg-forest-surface/80 p-2.5 rounded-2xl border border-gold/20 text-center">
          <p class="text-[9px] text-emerald-300 font-semibold">الورديات</p>
          <p class="text-sm font-black text-gold">${state.user.totalShifts}</p>
        </div>
        <div class="bg-forest-surface/80 p-2.5 rounded-2xl border border-gold/20 text-center">
          <p class="text-[9px] text-emerald-300 font-semibold">الساعات</p>
          <p class="text-sm font-black text-white">${state.user.totalHours}</p>
        </div>
        <div class="bg-forest-surface/80 p-2.5 rounded-2xl border border-gold/20 text-center">
          <p class="text-[9px] text-emerald-300 font-semibold">الأرباح</p>
          <p class="text-sm font-black text-emerald-400">${state.wallet.balance.toLocaleString('ar-SA')}</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="openWallet()" class="bg-gradient-to-br from-gold to-gold-light text-forest-dark p-2.5 rounded-xl font-black text-[10px] flex flex-col items-center gap-1 shadow">
          <i class="fa-solid fa-wallet text-lg"></i> المحفظة
        </button>
        <button onclick="openChat()" class="bg-forest-surface border border-gold/30 text-gold p-2.5 rounded-xl font-black text-[10px] flex flex-col items-center gap-1">
          <i class="fa-solid fa-comments text-lg"></i> المحادثات
        </button>
      </div>

      <div class="bg-gradient-to-r from-forest-surface to-forest p-3 rounded-2xl border border-gold/30 flex items-center justify-between">
        <div>
          <h3 class="font-extrabold text-xs text-gold flex items-center gap-1"><i class="fa-solid fa-bolt text-amber-400"></i> ورديات عاجلة</h3>
          <p class="text-[10px] text-slate-300">كوادر فورية لموسم الحج والعمرة</p>
        </div>
        <span class="bg-emerald-500/20 text-emerald-300 text-[9px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/40 animate-pulse">حيّ</span>
      </div>

      <div class="space-y-2.5">
        <div class="bg-forest-surface/90 p-3 rounded-2xl border border-gold/30 space-y-2">
          <div class="flex justify-between items-start">
            <div class="flex gap-2 items-center">
              <div class="w-9 h-9 rounded-xl bg-forest-dark border border-gold/40 flex items-center justify-center text-gold text-base">
                <i class="fa-solid fa-hotel"></i>
              </div>
              <div>
                <h4 class="font-bold text-xs text-white">موظف استقبال وضيافة</h4>
                <p class="text-[10px] text-emerald-300">فندق برج الساعة - مكة</p>
              </div>

function calcShiftCost() {
  const el = document.getElementById('shiftRoleSelect');
  if (!el) return;
  const r = parseFloat(el.value) || 45;
  const w = parseInt(document.getElementById('workersCount').value) || 1;
  const h = parseInt(document.getElementById('hoursCount').value) || 1;
  const base = r * w * h, fee = base * 0.15;
  document.getElementById('baseCostText').innerText = base.toLocaleString('ar-SA') + ' ر.س';
  document.getElementById('feeCostText').innerText = fee.toLocaleString('ar-SA') + ' ر.س';
  document.getElementById('totalCostText').innerText = (base+fee).toLocaleString('ar-SA') + ' ر.س';
}
function publishShift(e) {
  e.preventDefault();
  alert('✅ تم نشر الطلب! سيتم إشعار الكوادر.');
  switchTab('dashboard');
}

function applyToShift(title, rate, place) {
  if (!confirm(`التقديم على "${title}" بأجر ${rate} ر.س/ساعة في ${place}؟`)) return;
  state.shifts.upcoming.unshift({

        </button>
      </div>
    </div>
  `;
  updateActiveShiftTimer();
}
function updateActiveShiftTimer() {
  if (!state.activeShift) return;
  const s = state.activeShift;
  if (!s.isBreak) s.elapsed = Math.floor((Date.now() - s.startTime) / 1000);
  const timerEl = document.getElementById('activeShiftTimer');
  const earnEl = document.getElementById('activeShiftEarnings');
  if (timerEl) timerEl.textContent = formatDuration(s.elapsed);
  if (earnEl) earnEl.textContent = ((s.elapsed / 3600) * s.baseRate).toFixed(2) + ' ر.س';
}
function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function toggleBreak() {
  if (!state.activeShift) return;
  state.activeShift.isBreak = !state.activeShift.isBreak;
  if (state.activeShift.isBreak) {
    state.activeShift.pausedAt = state.activeShift.elapsed;
    state.activeShift.startTime = null;
  } else {
    state.activeShift.startTime = Date.now() - state.activeShift.pausedAt * 1000;
  }
  renderActiveShift();
}
function endActiveShift() {
  if (!state.activeShift) return;
  if (!confirm('إنهاء الوردية؟')) return;
  const s = state.activeShift;
  const earned = Math.round((s.elapsed / 3600) * s.baseRate);
  state.wallet.balance += earned;
  state.wallet.transactions.unshift({
    type:'credit', amount: earned,
    description: `أرباح وردية: ${s.title}`,
    date: new Date().toLocaleDateString('ar-SA')
  });
  state.shifts.past.unshift({
    id: s.id, title: s.title, place: s.place,
    date: new Date().toLocaleDateString('ar-SA'),
    rate: s.baseRate, hours: Math.round(s.elapsed/3600 * 10)/10,
    earned: earned, rating: 5
  });
  if (activeShiftTimer) clearInterval(activeShiftTimer);
  activeShiftTimer = null;
  const shiftTitle = s.title;
  state.activeShift = null;
  hideActiveShiftOverlay();
  renderAppScreen();
  showRateModal(shiftTitle);
}

    text.className = 'text-amber-400';
  } else {
    icon.className = 'fa-solid fa-wifi text-emerald-400';
    text.textContent = 'متصل';
    text.className = 'text-emerald-400';
  }
}

/* ============ MODALS ============ */
function openModal(html) {
  const m = document.getElementById('modalContainer');
  m.innerHTML = html;
  m.classList.remove('force-hidden');
}
function closeModal() {
  document.getElementById('modalContainer').classList.add('force-hidden');
  document.getElementById('modalContainer').innerHTML = '';
}

/* ============ PRAYER ============ */
function updatePrayerBar() {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let next = null;
  for (const p of state.prayerTimes) {
    const [h, m] = p.time.split(':').map(Number);
    if (h * 60 + m > nowMin) { next = p; break; }
  }
  if (!next) next = state.prayerTimes[0];
  const el = document.getElementById('nextPrayerText');
  if (el) el.textContent = `الصلاة القادمة: ${next.name} ${next.time}`;
}

/* ============ INIT ============ */
function initApp() {
  loadState();
  buildOtpInputs();
  if (state.isAuthenticated) {
    showEl('mainApp');
    hideEl('authScreen');
  } else {
    showEl('authScreen');
    hideEl('mainApp');
  }
  updateRoleButtons();
  updateNavBar();
  renderAppScreen();
  updateBadges();
  updatePrayerBar();
  setInterval(updatePrayerBar, 60000);
}

initApp();
</script>
</body>
