<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق وردية - النسخة المتقدمة | Wardya Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a2e23">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      forest: { DEFAULT:'#0a2e23', dark:'#061c15', light:'#0d3b2e', surface:'#124839' },
      gold: { DEFAULT:'#d4af37', light:'#e6ca65', dark:'#aa8c2c' }
    },
    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
  }}
}
</script>
<style>
body { font-family:'Cairo', sans-serif; background: radial-gradient(circle at center, #0d3b2e 0%, #061c15 100%); min-height:100vh; }
.hide-scrollbar::-webkit-scrollbar { display:none; }
.hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.force-hidden { display: none !important; }
@keyframes pulse-ring { 0% { transform:scale(0.95); box-shadow:0 0 0 0 rgba(212,175,55,0.7);} 70% { transform:scale(1); box-shadow:0 0 0 15px rgba(212,175,55,0);} 100% { transform:scale(0.95); box-shadow:0 0 0 0 rgba(212,175,55,0);} }
.pulse-ring { animation: pulse-ring 2s infinite; }
@keyframes slide-up { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.slide-up { animation: slide-up 0.3s ease-out; }
</style>
</head>
<body class="flex flex-col items-center justify-center p-2 sm:p-6 text-slate-100 min-h-screen">

<div class="mb-4 text-center space-y-1">
  <h1 class="text-xl sm:text-2xl font-black text-gold tracking-wide flex items-center justify-center gap-2">
    <i class="fa-solid fa-kaaba text-gold"></i> منصة وَردِيّة | Wardya
  </h1>
  <p class="text-xs text-emerald-200">النسخة المتقدمة — الحضور الجغرافي بدون إنترنت</p>
</div>

<!-- PHONE FRAME -->
<div class="relative w-full max-w-[420px] h-[850px] bg-black rounded-[50px] p-3 shadow-2xl border-[6px] border-slate-700/80 ring-1 ring-gold/30 flex flex-col justify-between overflow-hidden">
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-[80] flex items-center justify-between px-4">
    <div class="w-3 h-3 bg-emerald-900 rounded-full flex items-center justify-center"><div class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></div></div>
    <div class="w-10 h-1 bg-slate-800 rounded-full"></div>
  </div>

  <div class="relative w-full h-full bg-forest-dark rounded-[40px] overflow-hidden border border-forest-light">
    
    <!-- ============ MAIN APP ============ -->
    <div id="mainApp" class="force-hidden flex flex-col h-full pt-6">
      <!-- HEADER -->
      <div class="bg-forest-light/95 backdrop-blur-md px-3 py-2.5 border-b border-gold/20 flex items-center justify-between z-40">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-gold-light to-gold flex items-center justify-center text-forest-dark font-black text-lg shadow-md border border-gold-light">و</div>
          <div>
            <h2 class="font-extrabold text-[11px] text-white leading-tight">وَردِيّة <span class="text-gold font-normal">| Wardya</span></h2>
            <p class="text-[8px] text-emerald-300/80 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> مكة المكرمة</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="openNotifications()" class="relative w-8 h-8 rounded-full bg-forest-surface flex items-center justify-center border border-gold/30"><i class="fa-solid fa-bell text-gold text-xs"></i></button>
          <button onclick="openChat()" class="relative w-8 h-8 rounded-full bg-forest-surface flex items-center justify-center border border-gold/30"><i class="fa-solid fa-comment-dots text-gold text-xs"></i></button>
        </div>
      </div>

      <!-- CONNECTION & PRAYER BAR -->
      <div class="bg-forest-dark px-3 py-1 border-b border-white/5 flex items-center justify-between text-[10px]">
        <div class="flex items-center gap-1 text-emerald-300">
          <i class="fa-solid fa-mosque text-gold text-[10px]"></i><span class="font-bold" id="nextPrayerText">الصلاة القادمة: العصر 15:35</span>
        </div>
        <div class="flex items-center gap-1 text-[9px]" id="connectionBox">
          <i class="fa-solid fa-wifi text-emerald-400"></i><span id="connectionStatus" class="text-emerald-400 font-bold">متصل</span>
        </div>
      </div>

      <!-- ROLE SWITCHER -->
      <div class="bg-forest p-1.5 border-b border-forest-light flex text-[10px] font-bold gap-1">
        <button id="btnRoleSeeker" onclick="setRole('seeker')" class="flex-1 py-1.5 rounded-lg transition-all flex items-center justify-center gap-1">
          <i class="fa-solid fa-user-graduate"></i> باحث عن وردية
        </button>
        <button id="btnRoleProvider" onclick="setRole('provider')" class="flex-1 py-1.5 rounded-lg transition-all flex items-center justify-center gap-1">
          <i class="fa-solid fa-building-user"></i> منشأة
        </button>
      </div>

      <!-- SCREEN CONTENT -->
      <div id="screenContainer" class="flex-1 overflow-y-auto hide-scrollbar p-3 space-y-3 text-slate-100"></div>

      <!-- BOTTOM NAV -->
      <div class="bg-forest-dark/95 backdrop-blur-md border-t border-gold/20 py-2 px-1 flex justify-around items-center text-[9px] text-emerald-200/70 z-40">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-chart-pie text-base"></i><span>الرئيسية</span>
        </button>
        <button onclick="switchTab('map')" id="nav-map" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-map-location-dot text-base"></i><span>الخريطة</span>
        </button>
        <button onclick="switchTab('create')" id="nav-create" class="flex flex-col items-center gap-0.5 transition-all px-1 relative">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gold to-gold-light text-forest-dark flex items-center justify-center -mt-4 shadow-lg border border-white/20"><i class="fa-solid fa-plus text-sm font-black"></i></div>
          <span class="text-[8px]">طلب</span>
        </button>
        <button onclick="switchTab('shifts')" id="nav-shifts" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-file-signature text-base"></i><span>وردياتي</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-0.5 transition-all px-1">
          <i class="fa-solid fa-id-card-clip text-base"></i><span>الملف</span>
        </button>
      </div>
    </div>

    <!-- ============ AUTH SCREEN ============ -->
    <div id="authScreen" class="force-hidden absolute inset-0 z-[65] bg-forest-dark flex flex-col">
      <div class="flex-1 flex flex-col items-center justify-center p-6 space-y-6 pt-12 overflow-y-auto hide-scrollbar">
        <div class="text-center space-y-2">
          <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-gold-light to-gold flex items-center justify-center text-forest-dark font-black text-4xl shadow-2xl border-4 border-gold-light/30">و</div>
          <h1 class="text-2xl font-black text-gold">وَردِيّة</h1>
          <p class="text-xs text-emerald-200">منصة التوظيف الموسمي بالساعة</p>
        </div>
        <div id="authStep1" class="w-full space-y-3">
          <label class="block text-xs font-bold text-emerald-200">رقم الجوال</label>
          <div class="flex items-center gap-2 bg-forest-surface border border-gold/30 rounded-xl p-3">
            <span class="text-slate-300 text-sm font-bold" dir="ltr">+966</span>
            <input id="phoneInput" type="tel" placeholder="5XXXXXXXX" maxlength="9" class="flex-1 bg-transparent outline-none text-white font-bold text-sm text-center" dir="ltr">
          </div>
          <button onclick="sendOTP()" class="w-full bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black py-3 rounded-xl shadow-lg text-sm"><i class="fa-solid fa-paper-plane ml-1"></i> إرسال رمز التحقق</button>
        </div>
        <div id="authStep2" class="force-hidden w-full space-y-3">
          <label class="block text-xs font-bold text-emerald-200 text-center">أدخل رمز التحقق</label>
          <div class="flex justify-center gap-2" id="otpInputs"></div>
          <button onclick="verifyOTP()" class="w-full bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black py-3 rounded-xl shadow-lg text-sm"><i class="fa-solid fa-shield-halved ml-1"></i> تحقق ودخول</button>
          <button onclick="backToPhone()" class="w-full text-xs text-emerald-300 py-2">← تغيير رقم الجوال</button>
        </div>
      </div>
    </div>

    <!-- ============ ACTIVE SHIFT OVERLAY ============ -->
    <div id="activeShiftOverlay" class="force-hidden absolute inset-0 z-[55] bg-forest-dark flex flex-col"></div>

    <!-- ============ OTHER OVERLAYS ============ -->
    <div id="notificationsDrawer" class="force-hidden absolute top-0 right-0 h-full w-[88%] bg-forest-dark z-[56] flex flex-col"></div>
    <div id="chatScreen" class="force-hidden absolute inset-0 z-[57] bg-forest-dark flex flex-col"></div>
    <div id="chatView" class="force-hidden absolute inset-0 z-[58] bg-forest-dark flex flex-col"></div>
    <div id="walletScreen" class="force-hidden absolute inset-0 z-[57] bg-forest-dark flex flex-col"></div>
    <div id="settingsScreen" class="force-hidden absolute inset-0 z-[57] bg-forest-dark flex flex-col"></div>
    <div id="modalContainer" class="force-hidden absolute inset-0 z-[60] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"></div>

  </div>
</div>

<script>
const state = {
  isAuthenticated: false, userRole: 'seeker', activeTab: 'dashboard', shiftsSubTab: 'upcoming',
  user: { name:'عبد الله محمد العتيبي', rating:4.9, totalShifts:28, totalHours:164 },
  wallet: { balance: 7380, transactions: [ { type:'credit', amount:360, description:'أرباح وردية - برج الساعة', date:'27 أكتوبر 2026' } ] },
  activeShift: null,
  pendingSyncs: [], 
  shifts: { 
    upcoming: [ 
      // تم إضافة إحداثيات وهمية (خطوط الطول والعرض) لموقع المنشأة لتجربة ميزة الـ GPS
      { id:'WRD-001', title:'مشرف تفويج بمخيمات منى', place:'المشاعر - منى', date:'غداً 04:00 م', rate:60, hours:8, lat: 21.4133, lng: 39.8933 } 
    ], 
    past: [] 
  },
  prayerTimes: [ { name:'الفجر', time:'04:32' }, { name:'الظهر', time:'12:18' }, { name:'العصر', time:'15:35' }, { name:'المغرب', time:'18:50' }, { name:'العشاء', time:'20:20' } ]
};
let activeShiftTimer = null;

// دوال مساعدة
function showEl(id) { document.getElementById(id).classList.remove('force-hidden'); }
function hideEl(id) { document.getElementById(id).classList.add('force-hidden'); }
function saveState() { try { localStorage.setItem('wardya', JSON.stringify({ isAuthenticated: state.isAuthenticated, userRole: state.userRole })); } catch(e){} }
function loadState() { try { const s = JSON.parse(localStorage.getItem('wardya') || '{}'); if (s.isAuthenticated) state.isAuthenticated = true; if (s.userRole) state.userRole = s.userRole; } catch(e){} }

// ---------------------------------------------------------
// شبكة الإنترنت والعمل بدون اتصال (Offline Mode)
// ---------------------------------------------------------
function updateNetworkStatus() {
  const isOnline = navigator.onLine;
  const icon = document.querySelector('#connectionBox i');
  const text = document.getElementById('connectionStatus');
  
  if (isOnline) {
    icon.className = 'fa-solid fa-wifi text-emerald-400';
    text.textContent = 'متصل (سيتم المزامنة)';
    text.className = 'text-emerald-400 font-bold';
    syncOfflineData(); // محاولة رفع البيانات المؤجلة
  } else {
    icon.className = 'fa-solid fa-plane-slash text-amber-400';
    text.textContent = 'بدون إنترنت (وضع الأوفلاين)';
    text.className = 'text-amber-400 font-bold';
  }
}

window.addEventListener('online', updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);

// المزامنة التلقائية عند عودة الإنترنت
function syncOfflineData() {
  const saved = JSON.parse(localStorage.getItem('wardya_pending_syncs') || '[]');
  if (saved.length === 0) return;

  console.log("جاري مزامنة البيانات مع السيرفر...", saved);
  
  // محاكاة إرسال البيانات للسيرفر (API Call)
  setTimeout(() => {
    localStorage.removeItem('wardya_pending_syncs'); // مسحها بعد النجاح
    state.pendingSyncs = [];
    updateSyncUI();
    alert(`✅ عاد الاتصال بالإنترنت! تم رفع ${saved.length} من سجلات الحضور المؤجلة بنجاح.`);
  }, 1500);
}

// ---------------------------------------------------------
// المصادقة والدخول
// ---------------------------------------------------------
function buildOtpInputs() {
  const cont = document.getElementById('otpInputs'); cont.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const inp = document.createElement('input'); inp.maxLength = 1; inp.inputMode = 'numeric'; inp.type = 'tel';
    inp.className = 'w-10 h-12 bg-forest-surface border border-gold/30 rounded-xl text-center text-lg font-black text-gold outline-none focus:border-gold';
    inp.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); if (e.target.value && i < 5) document.querySelectorAll('#otpInputs input')[i + 1].focus(); const all = document.querySelectorAll('#otpInputs input'); if ([...all].every(inp => inp.value)) setTimeout(verifyOTP, 300); });
    cont.appendChild(inp);
  }
}
function sendOTP() { const phone = document.getElementById('phoneInput').value.trim(); if (phone.length < 9) { alert('أدخل رقم جوال صحيح (9 أرقام)'); return; } document.getElementById('authStep1').classList.add('force-hidden'); document.getElementById('authStep2').classList.remove('force-hidden'); setTimeout(() => document.querySelectorAll('#otpInputs input')[0].focus(), 100); }
function backToPhone() { document.getElementById('authStep1').classList.remove('force-hidden'); document.getElementById('authStep2').classList.add('force-hidden'); document.querySelectorAll('#otpInputs input').forEach(i => i.value = ''); }
function verifyOTP() { state.isAuthenticated = true; saveState(); hideEl('authScreen'); showEl('mainApp'); updateRoleButtons(); updateNavBar(); renderAppScreen(); updateNetworkStatus(); }
function logout() { if (!confirm('هل تريد تسجيل الخروج؟')) return; state.isAuthenticated = false; state.activeShift = null; if (activeShiftTimer) clearInterval(activeShiftTimer); saveState(); hideEl('settingsScreen'); hideEl('mainApp'); showEl('authScreen'); backToPhone(); }

// ---------------------------------------------------------
// التنقل والواجهات الأساسية
// ---------------------------------------------------------
function setRole(role) { state.userRole = role; saveState(); updateRoleButtons(); renderAppScreen(); }
function updateRoleButtons() {
  const s = document.getElementById('btnRoleSeeker'); const p = document.getElementById('btnRoleProvider');
  const active = 'flex-1 py-1.5 rounded-lg bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black shadow transition-all flex items-center justify-center gap-1';
  const inactive = 'flex-1 py-1.5 rounded-lg text-emerald-200 hover:text-white transition-all flex items-center justify-center gap-1';
  if (state.userRole === 'seeker') { s.className = active; p.className = inactive; } else { p.className = active; s.className = inactive; }
}
function switchTab(tab) { state.activeTab = tab; updateNavBar(); renderAppScreen(); }
function updateNavBar() {
  const tabs = ['dashboard','map','create','shifts','profile'];
  tabs.forEach(t => {
    const el = document.getElementById('nav-' + t); if (!el) return;
    if (t === state.activeTab) { el.className = "flex flex-col items-center gap-0.5 transition-all px-1 text-gold font-bold"; } 
    else { el.className = "flex flex-col items-center gap-0.5 transition-all px-1 text-emerald-200/70 hover:text-gold"; }
  });
}

function renderAppScreen() {
  if (state.activeTab === 'dashboard') renderDashboard();
  else if (state.activeTab === 'map') renderMap();
  else if (state.activeTab === 'create') renderCreate();
  else if (state.activeTab === 'shifts') renderShifts();
  else if (state.activeTab === 'profile') renderProfile();
}

// ---------------------------------------------------------
// شاشة الرئيسية
// ---------------------------------------------------------
function renderDashboard() {
  const c = document.getElementById('screenContainer');
  if (state.userRole === 'seeker') {
    c.innerHTML = `
      ${state.activeShift ? `<div class="bg-gradient-to-r from-emerald-600 to-emerald-500 p-3 rounded-2xl border border-emerald-400 space-y-2"><span class="text-[10px] font-black text-white">وردية نشطة الآن</span><h3 class="font-bold text-white text-xs">${state.activeShift.title}</h3><button onclick="showActiveShiftOverlay()" class="w-full bg-white text-emerald-700 font-black py-1.5 rounded-xl text-xs">استعراض</button></div>` : ''}
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-forest-surface/80 p-2.5 rounded-2xl border border-gold/20 text-center"><p class="text-[9px] text-emerald-300">الورديات</p><p class="text-sm font-black text-gold">${state.user.totalShifts}</p></div>
        <div class="bg-forest-surface/80 p-2.5 rounded-2xl border border-gold/20 text-center"><p class="text-[9px] text-emerald-300">الساعات</p><p class="text-sm font-black text-white">${state.user.totalHours}</p></div>
        <div class="bg-forest-surface/80 p-2.5 rounded-2xl border border-gold/20 text-center"><p class="text-[9px] text-emerald-300">الأرباح</p><p class="text-sm font-black text-emerald-400">${state.wallet.balance}</p></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="openWallet()" class="bg-gradient-to-br from-gold to-gold-light text-forest-dark p-2.5 rounded-xl font-black text-[10px] flex flex-col items-center gap-1"><i class="fa-solid fa-wallet text-lg"></i> المحفظة</button>
        <button onclick="openChat()" class="bg-forest-surface border border-gold/30 text-gold p-2.5 rounded-xl font-black text-[10px] flex flex-col items-center gap-1"><i class="fa-solid fa-comments text-lg"></i> المحادثات</button>
      </div>
      <div class="bg-gradient-to-r from-forest-surface to-forest p-3 rounded-2xl border border-gold/30 flex items-center justify-between">
        <div><h3 class="font-extrabold text-xs text-gold"><i class="fa-solid fa-bolt text-amber-400"></i> ورديات عاجلة</h3><p class="text-[10px] text-slate-300">كوادر فورية لموسم الحج</p></div>
        <span class="bg-emerald-500/20 text-emerald-300 text-[9px] px-2 py-0.5 rounded-full border border-emerald-500/40 animate-pulse">حيّ</span>
      </div>
      <div class="space-y-2.5">
        ${state.shifts.upcoming.map(s => `
        <div class="bg-forest-surface/90 p-3 rounded-2xl border border-gold/30 space-y-2">
          <div class="flex justify-between items-start">
            <div class="flex gap-2 items-center"><div class="w-9 h-9 rounded-xl bg-forest-dark border border-gold/40 flex items-center justify-center text-gold text-base"><i class="fa-solid fa-hotel"></i></div><div><h4 class="font-bold text-xs text-white">${s.title}</h4><p class="text-[10px] text-emerald-300">${s.place}</p></div></div>
            <div class="text-left"><span class="text-xs font-black text-gold bg-gold/10 px-2 py-0.5 rounded-lg border border-gold/30">${s.rate} ر.س/س</span><p class="text-[8px] text-slate-400">${s.hours} ساعات</p></div>
          </div>
          <button onclick="applyToShift('${s.title}', ${s.rate}, '${s.place}', ${s.lat}, ${s.lng})" class="w-full bg-gradient-to-r from-gold to-gold-light text-forest-dark font-black py-1.5 rounded-xl text-[10px]">تقديم</button>
        </div>`).join('')}
      </div>
    `;
  } else {
    c.innerHTML = `<div class="bg-forest-surface p-3 rounded-2xl border border-gold/30 text-center"><h3 class="text-gold font-bold">لوحة المنشأة</h3><button onclick="switchTab('create')" class="mt-2 bg-gold text-forest-dark px-3 py-1 rounded">نشر طلب</button></div>`;
  }
}

// ---------------------------------------------------------
// باقي الشاشات (الخريطة، الإنشاء، الملف الشخصي)
// ---------------------------------------------------------
function renderMap() { document.getElementById('screenContainer').innerHTML = `<div class="bg-forest-surface p-4 text-center text-gold text-xs">الخريطة التفاعلية</div>`; }
function renderCreate() { document.getElementById('screenContainer').innerHTML = `<div class="bg-forest-surface p-4 text-center"><h3 class="text-gold font-bold">نشر طلب جديد</h3><button onclick="alert('تم النشر'); switchTab('dashboard')" class="w-full mt-4 bg-gold text-forest-dark py-2 rounded">نشر</button></div>`; }
function renderProfile() { document.getElementById('screenContainer').innerHTML = `<div class="bg-forest-surface p-4 text-center"><h3 class="text-gold font-bold">${state.user.name}</h3><button onclick="openSettings()" class="mt-2 text-xs text-emerald-300">الإعدادات</button></div>`; }

// ---------------------------------------------------------
// شاشة "وردياتي" (بدء الوردية)
// ---------------------------------------------------------
function renderShifts() {
  document.getElementById('screenContainer').innerHTML = `
    <div class="space-y-2">
      ${state.shifts.upcoming.map(s => `
        <div class="bg-forest-surface p-3 rounded-2xl border border-gold/20 space-y-2">
          <div class="flex justify-between items-start"><div><h4 class="font-bold text-white text-xs">${s.title}</h4><p class="text-[10px] text-emerald-300">${s.place}</p></div><span class="text-[10px] text-gold bg-gold/10 px-2 py-0.5 rounded border border-gold/30 font-bold">${s.rate} ر.س/س</span></div>
          <button onclick="startActiveShift('${s.id}')" class="w-full bg-gold text-forest-dark font-black py-1.5 rounded-lg text-[10px]"><i class="fa-solid fa-play"></i> بدء الوردية الآن</button>
        </div>
      `).join('')}
      ${state.shifts.upcoming.length === 0 ? '<p class="text-center text-slate-400 text-xs mt-4">لا توجد ورديات قادمة</p>' : ''}
    </div>`;
}

function applyToShift(title, rate, place, lat, lng) {
  if (!confirm(`التقديم على ${title}؟`)) return; 
  state.shifts.upcoming.unshift({ id: 'WRD-' + Date.now(), title, place, rate, hours: 6, date: 'اليوم', lat, lng }); 
  switchTab('shifts'); 
}

// ---------------------------------------------------------
// الوردية النشطة (بما فيها ميزة GPS)
// ---------------------------------------------------------
function startActiveShift(id) {
  const shift = state.shifts.upcoming.find(s => s.id === id); 
  if (!shift) return;
  state.activeShift = { ...shift, startTime: Date.now(), elapsed: 0 };
  state.shifts.upcoming = state.shifts.upcoming.filter(s => s.id !== id);
  if (activeShiftTimer) clearInterval(activeShiftTimer);
  activeShiftTimer = setInterval(updateActiveShiftTimer, 1000);
  showActiveShiftOverlay();
  switchTab('dashboard');
}

function showActiveShiftOverlay() { showEl('activeShiftOverlay'); renderActiveShift(); }
function hideActiveShiftOverlay() { hideEl('activeShiftOverlay'); }

function renderActiveShift() {
  const shift = state.activeShift; 
  if (!shift) return;
  document.getElementById('activeShiftOverlay').innerHTML = `
    <div class="flex flex-col h-full pt-8 px-4 pb-4 overflow-y-auto hide-scrollbar">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-black text-gold">${shift.title}</h2>
        <button onclick="hideActiveShiftOverlay()" class="w-8 h-8 rounded-full bg-forest-surface border border-gold/30 flex items-center justify-center text-gold"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="bg-forest-surface rounded-3xl p-5 border-2 border-gold/40 text-center space-y-2 mb-3">
        <p class="text-[10px] text-emerald-300">الوقت المنقضي</p>
        <p id="activeShiftTimer" class="text-4xl font-black text-gold font-mono">00:00:00</p>
        <p class="text-xl font-black text-emerald-400" id="activeShiftEarnings">0.00 ر.س</p>
      </div>

      <!-- قسم تسجيل الحضور الجغرافي (GPS) - يعمل بدون إنترنت -->
      <div class="bg-forest-surface p-3 rounded-2xl border border-emerald-500/40 space-y-2 mb-3 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-16 h-16 bg-emerald-500/10 rounded-bl-full"></div>
        <h4 class="font-extrabold text-xs text-emerald-300 flex items-center gap-1">
          <i class="fa-solid fa-location-crosshairs animate-pulse"></i> إثبات الحضور الجغرافي (Offline)
        </h4>
        <p class="text-[9px] text-slate-300 leading-relaxed">يعمل هذا الزر بدون إنترنت. سيتم حساب موقعك عبر الأقمار الصناعية وحفظ الحضور في ذاكرة الجهاز، ورفعه للسيرفر تلقائياً عند عودة الشبكة.</p>
        
        <div id="gpsStatusBox" class="bg-forest-dark p-2 rounded-xl text-center text-[10px] text-slate-400 border border-white/5 mt-2">
          بانتظار تسجيل الحضور...
        </div>

        <button onclick="checkInGPS()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl text-xs shadow-lg transition-all flex justify-center items-center gap-2 mt-2">
          <i class="fa-solid fa-fingerprint text-lg"></i> تسجيل الحضور الآن
        </button>
      </div>

      <!-- عدادات المزامنة -->
      <div id="syncBox" class="bg-amber-500/10 border border-amber-500/30 p-2 rounded-xl text-center text-[10px] text-amber-300 hidden">
        لديك <span id="pendingCount" class="font-bold">0</span> عمليات حضور بانتظار المزامنة...
      </div>

      <div class="mt-auto pt-4">
        <button onclick="endActiveShift()" class="w-full bg-red-600/20 border border-red-600 text-red-500 font-black py-3 rounded-xl">إنهاء الوردية</button>
      </div>
    </div>`;
  updateActiveShiftTimer();
  updateSyncUI();
}

function updateActiveShiftTimer() {
  if (!state.activeShift) return; 
  const s = state.activeShift;
  s.elapsed = Math.floor((Date.now() - s.startTime) / 1000);
  const t = document.getElementById('activeShiftTimer'); if (t) t.textContent = formatDuration(s.elapsed);
  const e = document.getElementById('activeShiftEarnings'); if (e) e.textContent = ((s.elapsed / 3600) * s.baseRate).toFixed(2) + ' ر.س';
}

function formatDuration(sec) {
  const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// دالة حساب المسافة (Haversine Formula) - تعمل بدون إنترنت
function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3; // نصف قطر الأرض بالمتر
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c; // المسافة بالمتر
}

// دالة تسجيل الحضور (GPS Check-in)
function checkInGPS() {
  const statusBox = document.getElementById('gpsStatusBox');
  statusBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-gold"></i> جاري تحديد موقعك...`;
  statusBox.className = "bg-forest-dark p-2 rounded-xl text-center text-[10px] text-gold border border-gold/30 mt-2";

  if (!navigator.geolocation) {
    statusBox.innerHTML = "جهازك لا يدعم تحديد الموقع (GPS)";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const userLat = position.coords.latitude;
      const userLng = position.coords.longitude;
      const shiftLat = state.activeShift.lat;
      const shiftLng = state.activeShift.lng;

      // حساب المسافة بين الموظف والموقع
      const distance = Math.round(getDistanceFromLatLonInMeters(userLat, userLng, shiftLat, shiftLng));

      if (distance <= 500) { // السماح بالحضور إذا كان داخل نطاق 500 متر
        statusBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-lg mb-1"></i><br>أنت داخل النطاق الجغرافي (${distance} متر).<br>تم توقيع الحضور بنجاح!`;
        statusBox.className = "bg-emerald-900/30 p-2 rounded-xl text-center text-[10px] text-emerald-300 border border-emerald-500/50 mt-2";
        
        // حفظ السجل في الذاكرة
        const record = {
          shiftId: state.activeShift.id,
          time: new Date().toISOString(),
          lat: userLat,
          lng: userLng,
          distance: distance
        };

        if (navigator.onLine) {
          // إذا كان هناك إنترنت، يتم الرفع مباشرة
          alert("✅ تم تسجيل الحضور ورفعه للسيرفر (متصل بالإنترنت).");
        } else {
          // إذا كان هناك إنقطاع، يتم الحفظ محلياً
          state.pendingSyncs.push(record);
          localStorage.setItem('wardya_pending_syncs', JSON.stringify(state.pendingSyncs));
          updateSyncUI();
        }
      } else {
        statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 text-lg mb-1"></i><br>أنت بعيد عن الموقع بـ ${distance} متر.<br>يجب أن تكون داخل نطاق 500 متر لتسجيل الحضور.`;
        statusBox.className = "bg-red-900/30 p-2 rounded-xl text-center text-[10px] text-red-300 border border-red-500/50 mt-2";
      }
    },
    (error) => {
      statusBox.innerHTML = "تعذر الحصول على الموقع. تأكد من تفعيل GPS والسماح للمتصفح بالوصول للموقع.";
      statusBox.className = "bg-red-900/30 p-2 rounded-xl text-center text-[10px] text-red-300 border border-red-500/50 mt-2";
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// تحديث واجهة المزامنة
function updateSyncUI() {
  const saved = JSON.parse(localStorage.getItem('wardya_pending_syncs') || '[]');
  state.pendingSyncs = saved;
  const syncBox = document.getElementById('syncBox');
  const countSpan = document.getElementById('pendingCount');
  if (syncBox) {
    if (state.pendingSyncs.length > 0) {
      syncBox.classList.remove('hidden');
      countSpan.textContent = state.pendingSyncs.length;
    } else {
      syncBox.classList.add('hidden');
    }
  }
}

function endActiveShift() { 
  if (!confirm('هل تريد إنهاء الوردية؟')) return; 
  if (activeShiftTimer) clearInterval(activeShiftTimer); 
  state.activeShift = null; 
  hideActiveShiftOverlay(); 
  switchTab('dashboard'); 
}
